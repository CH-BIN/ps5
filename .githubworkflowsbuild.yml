name: Build HDD KeepAwake for pldmgr
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 【重点】手动按钮触发！push失效时可以点按钮跑
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          docker run --rm -v "$PWD:/src" ps5payload/sdk \
          prospero-clang /src/hdd_keepawake.c -o /src/hdd_keepawake.elf -lpthread
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdd_keepawake
          path: hdd_keepawake.elf
